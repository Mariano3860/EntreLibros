services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${E2E_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${E2E_DB_NAME:-entrelibros_e2e}
    ports:
      - "${E2E_DB_PORT:-55432}:5432"
    volumes:
      - entrelibros_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  entrelibros_e2e_data:
